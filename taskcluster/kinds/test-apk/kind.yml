---
loader: taskgraph.loader.transform:loader

transforms:
    - gecko_taskgraph.transforms.test_apk:transforms
    # While not a build, the build optimization works well for these tasks.
    - gecko_taskgraph.transforms.build_schedules:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - toolchain
    - build-fat-aar

task-defaults:
    run-on-repo-type: [hg]
    attributes:
        build_platform: android
        retrigger: true
    dependencies:
        build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
    fetches:
        toolchain:
            - android-sdk-linux
            - linux64-embedded-uniffi-bindgen
            - linux64-nimbus-fml
            - android-gradle-dependencies
            - linux64-jdk
        build-fat-aar:
            - target.maven.zip
    run:
        using: gradlew
    treeherder:
        kind: test
    worker-type: b-linux-medium
    worker:
        docker-image: {in-tree: android-components}
        max-run-time: 7200

tasks:
    focus-debug:
        description: Focus unit tests
        attributes:
            build-type: focus-debug
            shipping-product: focus
        run:
            pre-gradlew:
                - ["cd", "mobile/android/focus-android"]
            gradlew: ['clean', 'test']
        treeherder:
            platform: 'focus-android-all/opt'
            symbol: focus-debug(T)
            tier: 1
        worker:
            artifacts:
                - name: public/reports/test-reports.zip
                  path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/focus-android/app/reports/test-reports.zip
                  type: file

    fenix-debug:
        description: Fenix unit tests
        attributes:
            build-type: fenix-debug
            shipping-product: fenix
        run:
            pre-gradlew:
                - ["cd", "mobile/android/fenix"]
                - ['java', '-version']
            gradlew: ['clean', 'testDebugUnitTest']
        treeherder:
            platform: 'fenix-android-all/opt'
            symbol: fenix-debug(T)
            tier: 1
        worker:
            artifacts:
                - name: public/reports/test-reports.zip
                  path: /builds/worker/workspace/obj-build/gradle/build/mobile/android/fenix/app/reports/test-reports.zip
                  type: file
        routes:
            by-level:
                '3':
                    - notify.slack-channel.C0134KJ4JHL.on-failed
                'default': []
        scopes:
            by-level:
                '3':
                    - queue:route:notify.slack-channel.C0134KJ4JHL.on-failed
                    - notify:slack-channel:C0134KJ4JHL
                'default': []
        extra:
            notify:
                by-level:
                    '3':
                        slackBlocks: |
                            [
                              {
                                "type": "header",
                                "text": {
                                  "type": "plain_text",
                                  "text": "firefox-android :firefox: ${task.metadata.name} :x:\n "
                                }
                              },
                              {
                                "type": "divider"
                              },
                              {
                                 "type": "section",
                                 "text": {
                                     "type": "mrkdwn",
                                     "text": "*Task*: <https://firefox-ci-tc.services.mozilla.com/tasks/${status.taskId}|Taskcluster>"
                                }
                              },
                              {
                                "type": "section",
                                "text": {
                                  "type": "mrkdwn",
                                  "text": "*Owner*: ${task.metadata.owner}"
                                }
                              },
                              {
                                "type": "section",
                                "text": {
                                  "type": "mrkdwn",
                                  "text": "*Source*: <${task.payload.env.GECKO_HEAD_REPOSITORY}/rev/${task.payload.env.GECKO_HEAD_REV}|Commit> :hg:"
                                }
                              },
                              {
                                "type": "section",
                                "text": {
                                  "type": "mrkdwn",
                                  "text": "*Test Log*: <https://firefox-ci-tc.services.mozilla.com/tasks/${status.taskId}/runs/0/logs/public/logs/live_backing.log|Build Log> :debug:"
                                }
                              },
                              {
                                "type": "divider"
                              },
                              {
                                "type": "context",
                                "elements": [
                                    {
                                        "type": "mrkdwn",
                                        "text": ":testops-notify: created by <https://mozilla-hub.atlassian.net/wiki/spaces/MTE/overview|Mobile Test Engineering>"
                                    }
                                ]
                              }
                            ]
                    'default': {}
